name: TheForge build and unit tests

on:
  push:
    branches:
      - main
      - codex/oracle-frontend-integration-20261106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore TheForge/Tests/TheForge.Tests/TheForge.Tests.csproj
      - name: Build
        run: dotnet build TheForge/Tests/TheForge.Tests/TheForge.Tests.csproj -c Release --no-restore
      - name: Run offline unit and integration tests
        run: >-
          dotnet test TheForge/Tests/TheForge.Tests/TheForge.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName!~WorkspaceBrowserTests&FullyQualifiedName!~PublishedStylesTests&FullyQualifiedName!~LiveOracleConnectionTests"
